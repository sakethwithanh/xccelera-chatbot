name: Refresh AI News

on:
  schedule:
    - cron: "0 6 * * *" # daily 06:00 UTC
  workflow_dispatch:

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger news ingest
        run: |
          curl -fsS -X POST \
            "https://context-bot-backend.vercel.app/api/news/refresh" \
            -H "x-cron-secret: ${{ secrets.CRON_SECRET }}"
